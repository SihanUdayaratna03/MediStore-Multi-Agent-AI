# ==============================================================================
# MediStore AI — Backend v3 Deployment (UCI-130 Complication Risk Predictor)
# File: k8s/backend-v3/deployment.yml
# Port: 8001 | uvicorn backend.api.v3_server:app
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medistore-backend-v3
  namespace: medistore-prod
  labels:
    app: medistore-ai
    service: backend-v3
    version: "3.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medistore-ai
      service: backend-v3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: medistore-ai
        service: backend-v3
    spec:
      containers:
        - name: backend-v3
          image: medistoreacr.azurecr.io/medistore-backend:latest
          command:
            - uvicorn
            - backend.api.v3_server:app
            - --host
            - "0.0.0.0"
            - --port
            - "8001"
            - --workers
            - "2"
          ports:
            - containerPort: 8001
              name: http
          envFrom:
            - configMapRef:
                name: medistore-config
            - secretRef:
                name: medistore-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /docs
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /docs
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
      imagePullSecrets:
        - name: acr-secret
