# ==============================================================================
# MediStore AI — Backend v3 Service
# File: k8s/backend-v3/service.yml
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: medistore-backend-v3
  namespace: medistore-prod
  labels:
    app: medistore-ai
    service: backend-v3
spec:
  type: ClusterIP
  selector:
    app: medistore-ai
    service: backend-v3
  ports:
    - name: http
      port: 8001
      targetPort: 8001
      protocol: TCP
